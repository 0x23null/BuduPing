name: Build Windows (BuduPing)

on:
  push:
    paths:
      - 'windows/**'
      - '.github/workflows/build-windows.yml'
      - '.github/scripts/report-ci.sh'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows/BuduPing
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore

      - name: Publish single-file exe
        id: publish
        run: >
          dotnet publish -c Release -r win-x64 --self-contained true
          /p:PublishSingleFile=true
          /p:IncludeNativeLibrariesForSelfExtract=true
          -o publish

      - name: Report CI result
        if: always()
        shell: bash
        run: bash "$GITHUB_WORKSPACE/.github/scripts/report-ci.sh" windows "${{ steps.publish.outcome }}" ""

      - name: Upload BuduPing.exe
        uses: actions/upload-artifact@v4
        with:
          name: BuduPing-windows-x64
          path: windows/BuduPing/publish/BuduPing.exe
