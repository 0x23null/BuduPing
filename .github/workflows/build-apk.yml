# BuduPing — Build APK tren may GitHub (khong can Android Studio)
name: Build APK (BuduPing)

on:
  push:
    paths:
      - 'android/**'
      - 'windows/BuduPing/Assets/Stickers/**'
      - '.github/workflows/build-apk.yml'
      - '.github/scripts/report-ci.sh'
      - 'tools/**'
      - 'tests/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Prepare shared sticker catalog and thumbnails
        working-directory: ${{ github.workspace }}
        run: |
          python -m pip install -r tools/requirements-assets.txt
          python tools/prepare_assets.py
          python -m unittest discover -s tests/assets -v

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build debug APK
        id: gradle_build
        run: |
          set -o pipefail
          ./gradlew assembleDebug --no-daemon 2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Report CI result
        if: always()
        run: bash "$GITHUB_WORKSPACE/.github/scripts/report-ci.sh" apk "${{ job.status }}" "$RUNNER_TEMP/build.log"

      - name: Upload BuduPing APK
        uses: actions/upload-artifact@v4
        with:
          name: BuduPing-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 90
