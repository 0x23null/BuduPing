name: Android UI review
on:
  push:
    branches: ['codex/buduping-0.2']
    paths:
      - 'android/**'
      - 'tools/prepare_assets.py'
      - '.github/workflows/ui-review.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare shared sticker assets
        run: |
          python -m pip install -r tools/requirements-assets.txt
          python tools/prepare_assets.py
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          script: |
            cd android
            chmod +x gradlew
            ./gradlew connectedDebugAndroidTest --no-daemon
      - name: Collect native screenshots
        if: always()
        run: adb pull /sdcard/Android/data/com.buduping.app/files/ui ui-screenshots || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: BuduPing-native-ui-review
          path: |
            ui-screenshots
            android/app/build/reports/androidTests
