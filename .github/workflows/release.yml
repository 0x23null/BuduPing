name: Release (BuduPing)

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Prepare shared sticker catalog and thumbnails
        working-directory: ${{ github.workspace }}
        run: |
          python -m pip install -r tools/requirements-assets.txt
          python tools/prepare_assets.py
          python -m unittest discover -s tests/assets -v

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build debug APK
        id: gradle_build
        run: |
          set -o pipefail
          ./gradlew assembleDebug --no-daemon 2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Stage APK with friendly name
        run: cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/BuduPing.apk"

      - name: Attach APK to release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ runner.temp }}/BuduPing.apk

      - name: Report CI result
        if: always()
        run: bash "$GITHUB_WORKSPACE/.github/scripts/report-ci.sh" release-apk "${{ job.status }}" "$RUNNER_TEMP/build.log"

  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows/BuduPing
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Prepare shared sticker catalog and thumbnails
        working-directory: ${{ github.workspace }}
        run: |
          python -m pip install -r tools/requirements-assets.txt
          python tools/prepare_assets.py
          python -m unittest discover -s tests/assets -v

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Verify delivery queue and pairing contract
        run: dotnet run --project ../../tests/BuduPing.CoreChecks -c Release

      - name: Restore
        run: dotnet restore

      - name: Publish single-file exe
        id: publish
        run: >
          dotnet publish -c Release -r win-x64 --self-contained true
          /p:PublishSingleFile=true
          /p:IncludeNativeLibrariesForSelfExtract=true
          -o publish

      - name: Attach EXE to release
        uses: softprops/action-gh-release@v2
        with:
          files: windows/BuduPing/publish/BuduPing.exe

      - name: Report CI result
        if: always()
        shell: bash
        run: bash "$GITHUB_WORKSPACE/.github/scripts/report-ci.sh" release-windows "${{ job.status }}" ""
