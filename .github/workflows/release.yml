name: Release (BuduPing)
on:
  push:
    tags: ['v*']
    branches: ['main']
    paths: ['VERSION']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: buduping-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Read version
        id: version
        run: |
          python - <<'PY'
          import os, re
          from pathlib import Path
          version = Path('VERSION').read_text().strip()
          if not re.fullmatch(r'\d+\.\d+\.\d+', version):
              raise SystemExit('VERSION must contain a semantic version')
          tag = os.environ['GITHUB_REF_NAME'] if os.environ['GITHUB_REF_TYPE'] == 'tag' else 'v' + version
          if tag != 'v' + version:
              raise SystemExit('Tag and VERSION do not match')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write('tag=' + tag + '\n')
          PY
  apk:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare and verify shared assets
        run: |
          python -m pip install -r tools/requirements-assets.txt
          python tools/prepare_assets.py
          python -m unittest discover -s tests/assets -v
      - name: Build APK
        working-directory: android
        run: |
          set -o pipefail
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon 2>&1 | tee "$RUNNER_TEMP/build.log"
          cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/BuduPing.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: ${{ runner.temp }}/BuduPing.apk
      - name: Report result
        if: always()
        run: bash .github/scripts/report-ci.sh release-apk "${{ job.status }}" "$RUNNER_TEMP/build.log"
  windows:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare and verify shared assets
        run: |
          python -m pip install -r tools/requirements-assets.txt
          python tools/prepare_assets.py
          python -m unittest discover -s tests/assets -v
      - name: Verify delivery contract
        run: dotnet run --project tests/BuduPing.CoreChecks -c Release
      - name: Build standalone EXE
        working-directory: windows/BuduPing
        shell: bash
        run: |
          set -o pipefail
          dotnet publish -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish 2>&1 | tee "$RUNNER_TEMP/build.log"
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: windows/BuduPing/publish/BuduPing.exe
      - name: Report result
        if: always()
        shell: bash
        run: bash .github/scripts/report-ci.sh release-windows "${{ job.status }}" "$RUNNER_TEMP/build.log"
  publish:
    needs: [version, apk, windows]
    runs-on: ubuntu-latest
    # Run 6 failed creating the release: 403 "Resource not accessible by
    # integration" — declare the permission on the job itself as well.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release-files
      - name: Publish both files together
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ needs.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: BuduPing ${{ needs.version.outputs.tag }} — UI and interactions preview
          prerelease: true
          body_path: docs/RELEASE-NOTES.md
          files: |
            release-files/BuduPing.apk
            release-files/BuduPing.exe
      - name: Report result
        if: always()
        run: bash .github/scripts/report-ci.sh release-publish "${{ job.status }}" ""
